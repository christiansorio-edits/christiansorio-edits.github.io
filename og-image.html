<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Link Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@500;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  /* Source of media/og-image.jpg (the picture shown when the site link is shared), 1200x627. Night Broadcast theme. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 627px; overflow: hidden; }
  body { position: relative; background: radial-gradient(ellipse 520px 420px at 82% 40%, rgba(255,42,42,0.3), transparent 70%), #070707; color: #f4f4f4; font-family: Inter, sans-serif; }
  .scan { position: absolute; inset: 0; z-index: 20; background: repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 3px); }
  .mono { font-family: 'JetBrains Mono', monospace; font-weight: 700; }
  .top { position: absolute; left: 70px; right: 70px; top: 44px; display: flex; justify-content: space-between; align-items: center; }
  .logo { font-family: Anton; font-size: 30px; letter-spacing: 1px; }
  .logo b { color: #ff2a2a; font-weight: 400; }
  .onair { background: #ff2a2a; font-size: 15px; letter-spacing: 2px; padding: 8px 14px; box-shadow: 0 0 24px rgba(255,42,42,0.6); }
  .kick { position: absolute; left: 70px; top: 138px; font-size: 15px; letter-spacing: 4px; color: #ff2a2a; }
  h1 { position: absolute; left: 66px; top: 166px; font-family: Anton; font-weight: 400; font-size: 118px; line-height: 0.95; text-transform: uppercase; }
  h1 span { color: #ff2a2a; }
  .list { position: absolute; left: 70px; top: 410px; font-size: 21px; line-height: 1.5; color: #b9b9b9; }
  .ticker { position: absolute; left: 0; right: 0; bottom: 40px; height: 58px; background: #ff2a2a; display: flex; align-items: center; z-index: 5; }
  .ticker .tag { background: #000; height: 100%; display: flex; align-items: center; padding: 0 22px; font-family: Anton; font-size: 24px; }
  .ticker .txt { font-family: 'JetBrains Mono'; font-weight: 700; font-size: 22px; letter-spacing: 2px; padding-left: 22px; }
  .tv { position: absolute; right: 90px; top: 100px; width: 270px; height: 380px; padding: 10px; border-radius: 18px; background: #161616; box-shadow: 0 0 0 1px #2a2a2a, 0 30px 70px rgba(0,0,0,0.7); }
  .tv .scr { position: relative; width: 100%; height: 100%; border-radius: 11px; overflow: hidden; background: #eee; }
  .tv img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .tv .scr::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.12) 0 2px, transparent 2px 4px); }
  .tv .rec { position: absolute; left: 24px; top: 22px; z-index: 2; font-size: 13px; color: #fff; display: flex; align-items: center; gap: 6px; background: rgba(0,0,0,0.6); padding: 4px 8px; }
  .tv .rec i { width: 8px; height: 8px; border-radius: 50%; background: #ff2a2a; }
  .l3 { position: absolute; left: 0; bottom: 34px; z-index: 2; }
  .l3 .a { background: #ff2a2a; font-family: Anton; font-size: 22px; padding: 4px 14px; display: inline-block; }
  .l3 .b { background: #fff; color: #000; font-weight: 800; font-size: 13px; padding: 5px 14px; }
</style>
</head>
<body>
  <div class="top"><div class="logo">CHRISTIAN<b>.</b></div><div class="onair mono">● ON AIR</div></div>
  <div class="kick mono">● NOW BROADCASTING · CREATIVE EDITOR</div>
  <h1>Christian<br><span>Sorio</span></h1>
  <div class="list">Short-Form Ads · Reels · UGC · AI Video<br>Thumbnails · Static Ads · Carousels</div>
  <div class="tv"><div class="scr"><img src="media/photo.png" alt=""></div><span class="rec mono"><i></i>REC</span><div class="l3"><div class="a">CHRISTIAN SORIO</div><div class="b">CREATIVE EDITOR · PH</div></div></div>
  <div class="ticker"><div class="tag">BREAKING</div><div class="txt">christiansorio-edits.github.io</div></div>
  <div class="scan"></div>
</body>
</html>
